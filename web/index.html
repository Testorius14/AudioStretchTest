<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estirador vocal</title>
<meta name="theme-color" content="#2a2a2e">
<meta name="description" content="Editor de voz en el navegador: estirar, cortar, mover y afinar notas, con WORLD.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#2a2a2e; --panel:#38383d; --borde:#555; --texto:#ddd; --acento:#4da3ff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--texto); font: 14px system-ui, sans-serif;
         display: flex; flex-direction: column; }
  .barra { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px;
           background: var(--panel); border-bottom: 1px solid var(--borde); }
  button, select, input { background: #222; color: var(--texto); border: 1px solid var(--borde);
           border-radius: 4px; padding: 6px 10px; font: inherit; }
  button:hover:not(:disabled) { border-color: var(--acento); }
  button.on { background: var(--acento); color: #000; }
  button:disabled { opacity: .4; }
  input[type=number] { width: 68px; }
  input[type=checkbox] { padding: 0; }
  label { display: flex; align-items: center; gap: 4px; }
  .sep { width: 1px; height: 24px; background: var(--borde); margin: 0 4px; }
  #zona { flex: 1; position: relative; min-height: 200px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #pie { display: flex; gap: 10px; align-items: center; padding: 6px; background: var(--panel);
         border-top: 1px solid var(--borde); }
  #desp { flex: 1; min-width: 80px; padding: 0; }
  #estado { flex: 3; font-size: 13px; }
  /* En pantallas angostas cada barra es una sola fila que se desliza con el dedo,
     asi el area de edicion queda lo mas grande posible. */
  @media (max-width: 760px) {
    .barra { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    .barra > * { flex: none; }
    button, select, input { padding: 8px 12px; }
    #pie { flex-direction: column; align-items: stretch; gap: 4px; }
    #desp { flex: none; width: 100%; }
    #estado { flex: none; }
  }
</style>
</head>
<body>
<div class="barra" id="barra1">
  <button id="bAbrir" title="Abrir un audio (wav, mp3, etc.)">Abrir audio</button>
  <input type="file" id="archivo" accept="audio/*" hidden>
  <button id="bAbrirProy" title="Seguir con un proyecto guardado antes">Abrir proyecto</button>
  <input type="file" id="archivoProy" hidden>
  <button id="bGuardarProy" disabled title="Guarda el audio y todas tus ediciones en un archivo para seguir después">Guardar proyecto</button>
  <span class="sep"></span>
  <select id="selFs" title="Calidad (más alta = más memoria)">
    <option value="22050">22 kHz</option>
    <option value="32000">32 kHz</option>
    <option value="44100">44 kHz</option>
  </select>
  <select id="selAn" title="Método de análisis del tono">
    <option value="0">Análisis rápido</option>
    <option value="1">Análisis preciso</option>
  </select>
  <label>Tono <input type="number" id="f0min" value="71" min="40" max="400"> a
    <input type="number" id="f0max" value="800" min="200" max="2000"> Hz</label>
  <button id="bInstalar" hidden title="Instalar como app en este dispositivo">Instalar app</button>
</div>
<div class="barra" id="barra2">
  <button id="tSel" class="on" title="Arrastrá sobre la onda para elegir un tramo">Seleccionar</button>
  <button id="tTono" title="Dibujá el tono con el dedo sobre las notas">Tono</button>
  <button id="tCortar" title="Tocá donde quieras partir el audio en segmentos">Cortar</button>
  <button id="tMover" title="Tocá un segmento y arrastralo en el tiempo">Mover</button>
  <span class="sep"></span>
  <label>Factor <input type="number" id="factor" value="2" step="0.1" min="0.1"></label>
  <label><input type="checkbox" id="conservar" checked> Conservar resto</label>
  <button id="bEstirar" disabled>Estirar</button>
  <span class="sep"></span>
  <button id="bBorrar" disabled title="Borra el segmento elegido (herramienta Mover) o el tramo seleccionado">Borrar</button>
  <label><input type="checkbox" id="cerrar" checked> Cerrar hueco</label>
  <span class="sep"></span>
  <button id="bAfinar" disabled title="Lleva cada nota cantada a su nota exacta (en la selección, o en todo el audio si no hay selección)">Afinar a la nota</button>
  <select id="modoAfinar" title="Cómo dejar cada nota">
    <option value="0">Nota exacta (plana)</option>
    <option value="0.5">Con algo de vibrato</option>
    <option value="1">Solo corregir desafinación</option>
  </select>
  <label title="Cuánto se acerca a la nota exacta"><input type="number" id="fuerza" value="100" min="0" max="100" step="5">%</label>
  <button id="bTonoOrig" disabled title="Vuelve al tono original en la selección (o en todo el audio)">Tono original</button>
  <span class="sep"></span>
  <button id="bDeshacer" disabled>Deshacer</button>
  <button id="bPlay" disabled>▶ Reproducir</button>
  <button id="bGuardar" disabled>Guardar WAV</button>
  <span class="sep"></span>
  <button id="bMenos" disabled>−</button>
  <button id="bMas" disabled>+</button>
</div>
<div id="zona"><canvas id="c"></canvas></div>
<div id="pie">
  <input type="range" id="desp" min="0" max="0" step="0.01" value="0" title="Desplazamiento en el tiempo">
  <span id="estado">Abrí un audio para empezar.</span>
</div>

<script src="editor.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const cv = $('c'), cx = cv.getContext('2d');
const GUT = 46, RULER = 22, WAVE = 70;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Motor (worker) ----------
const worker = new Worker('worker.js');
let sigId = 1;
const pend = new Map();
worker.onmessage = (e) => {
  const p = pend.get(e.data.id);
  if (!p) return;
  pend.delete(e.data.id);
  e.data.error ? p.rej(new Error(e.data.error)) : p.res(e.data);
};
worker.onerror = (e) => {
  setEstado('Error del motor: ' + (e.message || 'no se pudo cargar world.js (¿ya compilaste el WebAssembly?)'));
};
function llamar(msg, transfer) {
  return new Promise((res, rej) => {
    const id = sigId++;
    pend.set(id, { res, rej });
    worker.postMessage(Object.assign({ id }, msg), transfer || []);
  });
}

// ---------- Estado ----------
const S = {
  fs: 22050, fp: 5, f0: null, picos: null, est: null, hist: [], sel: null, seg: null,
  t0: 0, pps: 100, herr: 'sel', mLo: 48, mHi: 84,
  curvaAct: null, curvaBase: null, hayTono: false,
  rendered: null, sucio: false, ocupado: false,
  ac: null, src: null, sonando: false, playT: null, playIni: 0, tIni: 0,
  arr: null, ancla: 0, ultJ: null, ultM: null,
  cortePrev: null, moverX0: 0, moverDelta: 0,
  audio16: null, par: null, cuadrosOrig: 0, nombre: 'audio',
};
window.estirador = { estado: () => S };  // solo para pruebas automaticas

function setEstado(t) { $('estado').textContent = t; }
function habilitar() {
  const ok = !!S.est && !S.ocupado;
  ['bEstirar', 'bPlay', 'bGuardar', 'bMenos', 'bMas', 'bBorrar', 'bAfinar', 'bTonoOrig', 'bGuardarProy']
    .forEach((id) => { $(id).disabled = !ok; });
  $('bDeshacer').disabled = !ok || S.hist.length === 0;
  $('bAbrir').disabled = S.ocupado;
  $('bAbrirProy').disabled = S.ocupado;
}
function ocupar(t) { S.ocupado = true; if (t) setEstado(t); habilitar(); }
function liberar() { S.ocupado = false; habilitar(); }

// ---------- Geometria ----------
function tam() { const r = cv.getBoundingClientRect(); return { W: r.width, H: r.height }; }
function geom() {
  const { W, H } = tam();
  const plotH = Math.max(40, H - RULER - WAVE);
  return { W, H, top: RULER, plotH, waveTop: RULER + plotH, rowH: plotH / (S.mHi - S.mLo) };
}
const xDeT = (t) => GUT + (t - S.t0) * S.pps;
const tDeX = (x) => S.t0 + (x - GUT) / S.pps;
const yDeMidi = (m, G) => G.top + (S.mHi - m) * G.rowH;
const frameDeX = (x) => Math.round(tDeX(x) * 1000 / S.fp);
const xDeFrame = (j) => xDeT(j * S.fp / 1000);
function duracion() { return S.est ? S.est.mapa.length * S.fp / 1000 : 0; }

function limitarScroll() {
  const { W } = tam();
  const visible = (W - GUT) / S.pps;
  S.t0 = clamp(S.t0, 0, Math.max(0, duracion() - visible * 0.5));
  const d = $('desp');
  d.max = Math.max(0, duracion());
  d.value = S.t0;
}

function ajustar() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * d);
  cv.height = Math.round(r.height * d);
  cx.setTransform(d, 0, 0, d, 0, 0);
  dibujar();
}

// ---------- Dibujo ----------
function dibujar() {
  const G = geom(), { W, H } = G;
  cx.clearRect(0, 0, W, H);
  cx.fillStyle = '#1d1d20';
  cx.fillRect(0, 0, W, H);
  if (!S.est) {
    cx.fillStyle = '#888'; cx.font = '16px system-ui'; cx.textAlign = 'center';
    cx.fillText('Abrí un audio para empezar', W / 2, H / 2);
    return;
  }
  const fp = S.fp;
  const jIni = Math.max(0, Math.floor(S.t0 * 1000 / fp) - 1);
  const jFin = Math.min(S.est.mapa.length - 1, Math.ceil(tDeX(W) * 1000 / fp) + 1);

  // Filas de notas (como un piano roll)
  cx.font = '11px system-ui'; cx.textAlign = 'right'; cx.textBaseline = 'middle';
  for (let m = Math.floor(S.mLo); m <= Math.ceil(S.mHi); m++) {
    const y = yDeMidi(m, G);
    if (y - G.rowH / 2 > G.waveTop || y + G.rowH / 2 < G.top) continue;
    cx.fillStyle = Editor.esTeclaNegra(m) ? '#232327' : '#1d1d20';
    cx.fillRect(GUT, y - G.rowH / 2, W - GUT, G.rowH);
    if (m % 12 === 0) { cx.fillStyle = '#3a3a40'; cx.fillRect(GUT, y + G.rowH / 2 - 1, W - GUT, 1); }
  }
  cx.fillStyle = '#16161a'; cx.fillRect(GUT, G.waveTop, W - GUT, WAVE);

  // Regla de tiempo
  cx.fillStyle = '#38383d'; cx.fillRect(0, 0, W, RULER);
  const pasos = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 30, 60, 120];
  let paso = pasos[pasos.length - 1];
  for (const p of pasos) if (p * S.pps >= 70) { paso = p; break; }
  cx.textAlign = 'left'; cx.textBaseline = 'middle'; cx.font = '11px system-ui';
  for (let t = Math.ceil(S.t0 / paso) * paso; xDeT(t) < W; t += paso) {
    const x = xDeT(t);
    cx.fillStyle = '#2f2f34'; cx.fillRect(x, RULER, 1, G.plotH + WAVE);
    cx.fillStyle = '#bbb'; cx.fillText(t.toFixed(paso < 1 ? 2 : 0) + ' s', x + 3, RULER / 2);
  }

  // Seleccion de tiempo
  if (S.sel) {
    cx.fillStyle = 'rgba(255,165,0,0.25)';
    cx.fillRect(xDeT(S.sel.a), RULER, xDeT(S.sel.b) - xDeT(S.sel.a), G.plotH + WAVE);
  }
  // Silencios (huecos)
  cx.fillStyle = 'rgba(0,0,0,0.5)';
  let ini = -1;
  for (let j = jIni; j <= jFin + 1; j++) {
    const sil = j <= jFin && S.est.mapa[j] < 0;
    if (sil && ini < 0) ini = j;
    if (!sil && ini >= 0) { cx.fillRect(xDeFrame(ini), RULER, (j - ini) * fp / 1000 * S.pps, G.plotH + WAVE); ini = -1; }
  }
  // Segmento elegido
  if (S.seg && S.herr === 'mover') {
    cx.fillStyle = 'rgba(77,163,255,0.2)';
    cx.fillRect(xDeFrame(S.seg.c0), RULER, (S.seg.c1 - S.seg.c0) * fp / 1000 * S.pps, G.plotH + WAVE);
  }

  // Curvas de tono
  cx.save();
  cx.beginPath(); cx.rect(GUT, G.top, W - GUT, G.plotH); cx.clip();
  if (S.hayTono) curva(S.curvaBase, '#777', 2, G, jIni, jFin);
  curva(S.curvaAct, '#4da3ff', 3, G, jIni, jFin);
  cx.restore();

  // Onda (aproximada a partir del original, sigue las ediciones al instante)
  const cy = G.waveTop + WAVE / 2, alto = WAVE / 2 - 4;
  cx.strokeStyle = '#6fbf73'; cx.lineWidth = 1; cx.beginPath();
  const mapa = S.est.mapa, picos = S.picos, n = mapa.length;
  for (let x = GUT; x < W; x++) {
    const j0 = Math.floor(tDeX(x) * 1000 / fp), j1 = Math.ceil(tDeX(x + 1) * 1000 / fp);
    if (j1 < 0 || j0 >= n) continue;
    let pk = 0;
    for (let j = Math.max(0, j0); j <= Math.min(n - 1, j1); j++) {
      if (mapa[j] < 0) continue;
      const v = picos[Math.round(mapa[j])] || 0;
      if (v > pk) pk = v;
    }
    cx.moveTo(x + 0.5, cy - pk * alto); cx.lineTo(x + 0.5, cy + pk * alto);
  }
  cx.stroke();

  // Bordes de la seleccion de tiempo
  if (S.sel) {
    cx.fillStyle = 'orange';
    cx.fillRect(xDeT(S.sel.a) - 1, RULER, 2, G.plotH + WAVE);
    cx.fillRect(xDeT(S.sel.b) - 1, RULER, 2, G.plotH + WAVE);
  }
  // Cortes
  cx.fillStyle = 'rgba(230,230,230,0.75)';
  for (const c of S.est.cortes) {
    if (c < jIni - 1 || c > jFin + 1) continue;
    const x = xDeFrame(c);
    cx.fillRect(x - 0.5, RULER, 1, G.plotH + WAVE);
    cx.beginPath(); cx.moveTo(x - 5, RULER); cx.lineTo(x + 5, RULER); cx.lineTo(x, RULER + 7); cx.closePath(); cx.fill();
  }
  // Vista previa al mover un segmento
  if (S.arr === 'mover' && S.seg && S.moverDelta) {
    const a = Math.max(0, S.seg.c0 + S.moverDelta), b = a + (S.seg.c1 - S.seg.c0);
    cx.fillStyle = 'rgba(255,255,255,0.18)';
    cx.fillRect(xDeFrame(a), RULER, (b - a) * fp / 1000 * S.pps, G.plotH + WAVE);
    cx.strokeStyle = '#fff'; cx.setLineDash([5, 4]); cx.lineWidth = 1.5;
    cx.strokeRect(xDeFrame(a), RULER + 1, (b - a) * fp / 1000 * S.pps, G.plotH + WAVE - 2);
    cx.setLineDash([]);
  }
  // Vista previa del corte
  if (S.arr === 'cortar' && S.cortePrev !== null) {
    const x = xDeFrame(S.cortePrev);
    cx.strokeStyle = '#ffe066'; cx.setLineDash([6, 4]); cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(x, RULER); cx.lineTo(x, RULER + G.plotH + WAVE); cx.stroke();
    cx.setLineDash([]);
  }
  // Cabezal de reproduccion
  if (S.playT !== null) {
    cx.fillStyle = '#ff5050'; cx.fillRect(xDeT(S.playT) - 1, RULER, 2, G.plotH + WAVE);
  }

  // Columna de notas por encima
  cx.fillStyle = '#38383d'; cx.fillRect(0, 0, GUT, H);
  cx.textAlign = 'right'; cx.textBaseline = 'middle'; cx.font = '11px system-ui';
  for (let m = Math.floor(S.mLo); m <= Math.ceil(S.mHi); m++) {
    const y = yDeMidi(m, G);
    if (y < G.top || y > G.waveTop) continue;
    if (G.rowH >= 9 || m % 12 === 0) {
      cx.fillStyle = Editor.esTeclaNegra(m) ? '#888' : '#ccc';
      cx.fillText(Editor.nombreNota(m), GUT - 5, y);
    }
  }
}

function curva(c, color, ancho, G, jIni, jFin) {
  if (!c) return;
  cx.strokeStyle = color; cx.lineWidth = ancho; cx.lineJoin = 'round';
  cx.beginPath();
  let abierto = false;
  for (let j = jIni; j <= jFin; j++) {
    const f = c[j];
    if (!(f > 0)) { abierto = false; continue; }
    const x = xDeFrame(j), y = yDeMidi(Editor.hzAMidi(f), G);
    if (abierto) cx.lineTo(x, y); else { cx.moveTo(x, y); abierto = true; }
  }
  cx.stroke();
}

function recalcular() {
  S.curvaAct = Editor.curvaPitch(S.f0, S.est, true);
  S.curvaBase = Editor.curvaPitch(S.f0, S.est, false);
  S.hayTono = false;
  for (let j = 0; j < S.est.semis.length; j++) if (Math.abs(S.est.semis[j]) > 1e-9) { S.hayTono = true; break; }
}

// ---------- Abrir audio o proyecto ----------
$('bAbrir').onclick = () => $('archivo').click();
$('archivo').onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) await abrir(f);
};
$('bAbrirProy').onclick = () => $('archivoProy').click();
$('archivoProy').onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) await abrirProyecto(f);
};

async function abrir(archivo) {
  try {
    parar();
    ocupar('Leyendo audio…');
    const fs = parseInt($('selFs').value, 10);
    const ab = await archivo.arrayBuffer();
    const tmp = new (window.AudioContext || window.webkitAudioContext)();
    const dec = await tmp.decodeAudioData(ab);
    tmp.close();
    const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(dec.duration * fs)), fs);
    const fuente = off.createBufferSource();
    fuente.buffer = dec; fuente.connect(off.destination); fuente.start();
    const rend = await off.startRendering();
    const datos = rend.getChannelData(0);
    // Se guarda en 16 bits: es lo que va al proyecto, y se analiza exactamente eso,
    // asi al reabrir el proyecto el analisis da lo mismo.
    const audio16 = new Int16Array(datos.length);
    for (let i = 0; i < datos.length; i++) audio16[i] = Math.round(clamp(datos[i], -1, 1) * 32767);
    await cargar(audio16, fs, {
      f0min: parseFloat($('f0min').value), f0max: parseFloat($('f0max').value),
      harvest: $('selAn').value === '1',
    }, null, archivo.name.replace(/\.[^.]*$/, '') || 'audio');
  } catch (err) {
    liberar();
    setEstado('No se pudo abrir el audio: ' + err.message);
  }
}

async function abrirProyecto(archivo) {
  try {
    parar();
    ocupar('Leyendo proyecto…');
    const p = Editor.leerProyecto(await archivo.arrayBuffer());
    if ([...$('selFs').options].some((o) => o.value === String(p.fs))) $('selFs').value = String(p.fs);
    $('selAn').value = p.harvest ? '1' : '0';
    $('f0min').value = p.f0min; $('f0max').value = p.f0max;
    S.fp = p.fp || 5;
    await cargar(p.audio, p.fs, { f0min: p.f0min, f0max: p.f0max, harvest: p.harvest }, p.est,
                 archivo.name.replace(/\.[^.]*$/, '') || 'proyecto');
  } catch (err) {
    liberar();
    setEstado('No se pudo abrir el proyecto: ' + err.message);
  }
}

// Analiza el audio con WORLD y deja todo listo para editar. Si viene `estRestaurado`
// (proyecto guardado), se conservan sus ediciones.
async function cargar(audio16, fs, par, estRestaurado, nombre) {
  const x = new Float64Array(audio16.length);
  for (let i = 0; i < x.length; i++) x[i] = audio16[i] / 32768;

  const seg = x.length / fs;
  const cuadros = seg * 1000 / S.fp;
  const bins = fs <= 24000 ? 513 : 1025;
  const mb = cuadros * bins * 8 * 4 / 1e6;
  if (mb > 500 && !confirm('Este audio necesita unos ' + Math.round(mb) + ' MB de memoria. ' +
      'En un teléfono puede fallar. ¿Continuar? (Probá con menos calidad o un audio más corto.)')) {
    liberar(); setEstado('Cancelado.'); return;
  }

  // Picos por cuadro (para dibujar la onda)
  const por = Math.max(1, Math.round(fs * S.fp / 1000));
  const picos = new Float32Array(Math.ceil(x.length / por) + 2);
  let maxAbs = 1e-9;
  for (let i = 0; i < x.length; i++) maxAbs = Math.max(maxAbs, Math.abs(x[i]));
  for (let i = 0; i < x.length; i++) {
    const k = (i / por) | 0, v = Math.abs(x[i]) / maxAbs;
    if (v > picos[k]) picos[k] = v;
  }

  setEstado('Analizando con WORLD… (puede tardar un rato en audios largos)');
  const r = await llamar({
    cmd: 'analizar', x, fs, fp: S.fp, f0min: par.f0min, f0max: par.f0max, harvest: par.harvest,
  }, [x.buffer]);

  let est = Editor.estadoInicial(r.cuadros);
  if (estRestaurado) {
    let mx = -1;
    for (let j = 0; j < estRestaurado.mapa.length; j++) if (estRestaurado.mapa[j] > mx) mx = estRestaurado.mapa[j];
    if (mx > r.cuadros - 1 + 1e-6) throw new Error('el proyecto no coincide con el análisis del audio');
    est = estRestaurado;
  }

  S.fs = fs; S.f0 = r.f0; S.picos = picos; S.audio16 = audio16; S.par = par;
  S.cuadrosOrig = r.cuadros; S.nombre = nombre; S.est = est;
  S.hist = []; S.sel = null; S.seg = null; S.rendered = null; S.sucio = true; S.t0 = 0;
  const { W } = tam();
  S.pps = clamp((W - GUT) / Math.max(1, Math.min(duracion(), 8)), 10, 5000);

  let lo = 1e9, hi = -1e9;
  for (let i = 0; i < S.f0.length; i++) if (S.f0[i] > 0) {
    const m = Editor.hzAMidi(S.f0[i]); lo = Math.min(lo, m); hi = Math.max(hi, m);
  }
  if (lo > hi) { lo = 52; hi = 76; }
  S.mLo = Math.floor(lo) - 6; S.mHi = Math.ceil(hi) + 6;
  if (S.mHi - S.mLo < 24) { const c = (S.mHi + S.mLo) / 2; S.mLo = Math.floor(c - 12); S.mHi = Math.ceil(c + 12); }

  recalcular(); limitarScroll(); liberar(); dibujar();
  setEstado(estRestaurado ? 'Proyecto abierto. Seguí donde lo dejaste.'
                          : 'Listo. Arrastrá sobre la onda para elegir un tramo y apretá Estirar.');
}

function descargar(buffer, nombre, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buffer], { type: tipo }));
  a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

$('bGuardarProy').onclick = () => {
  if (!S.est || S.ocupado) return;
  const buf = Editor.guardarProyecto({
    fs: S.fs, fp: S.fp, f0min: S.par.f0min, f0max: S.par.f0max, harvest: S.par.harvest,
    cuadrosOrig: S.cuadrosOrig, audio: S.audio16, est: S.est,
  });
  descargar(buf, S.nombre + '.estirador', 'application/octet-stream');
  setEstado('Proyecto guardado como ' + S.nombre + '.estirador. Para seguir después, usá "Abrir proyecto".');
};

// ---------- Historial ----------
function guardarHist() {
  S.hist.push({ est: Editor.copiar(S.est), sel: S.sel ? { a: S.sel.a, b: S.sel.b } : null });
  if (S.hist.length > 40) S.hist.shift();
  habilitar();
}
$('bDeshacer').onclick = () => {
  if (!S.hist.length || S.ocupado) return;
  const h = S.hist.pop();
  S.est = h.est; S.sel = h.sel; S.seg = null; S.sucio = true;
  recalcular(); limitarScroll(); habilitar(); dibujar();
  setEstado('Deshecho.');
};

// ---------- Estirar ----------
$('bEstirar').onclick = () => {
  if (!S.est || S.ocupado) return;
  if (!S.sel) { setEstado('Primero arrastrá sobre la onda para elegir el tramo (herramienta Seleccionar).'); return; }
  const factor = parseFloat($('factor').value);
  if (!(factor > 0)) { setEstado('El factor no es válido.'); return; }
  const conservar = $('conservar').checked;
  const r = Editor.estirar(S.est, S.sel.a * 1000 / S.fp, S.sel.b * 1000 / S.fp, factor, conservar);
  if (!r) { setEstado('El tramo es demasiado corto.'); return; }
  guardarHist();
  S.est = r.est; S.seg = null;
  S.sel = { a: r.nuevoA * S.fp / 1000, b: r.nuevoB * S.fp / 1000 };
  if (!conservar) S.t0 = 0;
  S.sucio = true;
  recalcular(); limitarScroll(); dibujar();
  setEstado('Tramo estirado x' + factor + '. Apretá Reproducir para escucharlo (se sintetiza en ese momento).');
};

// ---------- Borrar ----------
$('bBorrar').onclick = () => {
  if (!S.est || S.ocupado) return;
  let c0, c1, que;
  if (S.herr === 'mover' && S.seg) { c0 = S.seg.c0; c1 = S.seg.c1; que = 'segmento'; }
  else if (S.sel) { c0 = Math.round(S.sel.a * 1000 / S.fp); c1 = Math.round(S.sel.b * 1000 / S.fp); que = 'tramo'; }
  else { setEstado('Elegí qué borrar: tocá un segmento con la herramienta Mover, o arrastrá un tramo con Seleccionar.'); return; }
  const r = Editor.borrar(S.est, c0, c1, $('cerrar').checked);
  if (!r) { setEstado('No se puede borrar eso (quedaría vacío).'); return; }
  guardarHist();
  S.est = r.est; S.seg = null; S.sel = null; S.sucio = true;
  recalcular(); limitarScroll(); habilitar(); dibujar();
  setEstado('Borrado el ' + que + ($('cerrar').checked ? ' y cerrado el hueco.' : ' (quedó en silencio).'));
};

// ---------- Afinar a la nota ----------
function rangoCuadros() {
  const n = S.est.mapa.length;
  return S.sel ? [S.sel.a * 1000 / S.fp, S.sel.b * 1000 / S.fp] : [0, n - 1];
}
$('bAfinar').onclick = () => {
  if (!S.est || S.ocupado) return;
  const [a, b] = rangoCuadros();
  const fuerza = parseFloat($('fuerza').value);
  guardarHist();
  const r = Editor.afinar(S.est, S.f0, a, b, {
    retener: parseFloat($('modoAfinar').value),
    fuerza: isNaN(fuerza) ? 1 : clamp(fuerza / 100, 0, 1),
  });
  if (!r.notas) {
    S.hist.pop(); habilitar();
    setEstado('No encontré voz para afinar en ' + (S.sel ? 'la selección.' : 'el audio.'));
    return;
  }
  S.sucio = true; recalcular(); habilitar(); dibujar();
  setEstado('Afinadas ' + r.notas + (r.notas === 1 ? ' nota' : ' notas') + (S.sel ? ' dentro de la selección' : ' en todo el audio') +
            '. Escuchalo con Reproducir; la curva gris es el tono original.');
};
$('bTonoOrig').onclick = () => {
  if (!S.est || S.ocupado) return;
  const [a, b] = rangoCuadros();
  guardarHist();
  Editor.restablecerTono(S.est, a, b);
  S.sucio = true; recalcular(); habilitar(); dibujar();
  setEstado('Tono original restablecido' + (S.sel ? ' en la selección.' : ' en todo el audio.'));
};

// ---------- Sintesis, reproduccion, guardado ----------
async function renderizar() {
  setEstado('Sintetizando con WORLD…');
  const e = S.est;
  const mapa = e.mapa.slice(), semis = e.semis.slice(), form = e.form.slice();
  const r = await llamar({ cmd: 'render', mapa, semis, form }, [mapa.buffer, semis.buffer, form.buffer]);
  let pico = 0;
  for (let i = 0; i < r.y.length; i++) pico = Math.max(pico, Math.abs(r.y[i]));
  if (pico > 0.99) { const g = 0.99 / pico; for (let i = 0; i < r.y.length; i++) r.y[i] *= g; }
  S.rendered = r.y; S.sucio = false;
}

async function asegurarRender() {
  if (!S.sucio && S.rendered) return true;
  try { ocupar(); await renderizar(); liberar(); return true; }
  catch (err) { liberar(); setEstado('Error al sintetizar: ' + err.message); return false; }
}

async function reproducir() {
  if (S.sonando) { parar(); return; }
  if (!S.est || S.ocupado) return;
  if (!(await asegurarRender())) return;
  const ctx = S.ac || (S.ac = new (window.AudioContext || window.webkitAudioContext)());
  if (ctx.state === 'suspended') await ctx.resume();
  const buf = ctx.createBuffer(1, S.rendered.length, S.fs);
  buf.copyToChannel(S.rendered, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination);
  const dur = S.rendered.length / S.fs;
  const rango = (S.herr === 'mover' && S.seg) ? { a: S.seg.c0 * S.fp / 1000, b: S.seg.c1 * S.fp / 1000 } : S.sel;
  const ini = rango ? clamp(rango.a, 0, Math.max(0, dur - 0.05)) : 0;
  const fin = rango ? clamp(rango.b, ini + 0.05, dur) : dur;
  src.start(0, ini, fin - ini);
  S.src = src; S.sonando = true; S.playIni = ini; S.tIni = ctx.currentTime;
  src.onended = () => { if (S.src === src) parar(); };
  $('bPlay').textContent = '■ Detener';
  setEstado('Reproduciendo…');
  animar();
}
function parar() {
  if (S.src) { try { S.src.stop(); } catch (_) { /* ya parado */ } S.src = null; }
  S.sonando = false; S.playT = null;
  $('bPlay').textContent = '▶ Reproducir';
  dibujar();
}
function animar() {
  if (!S.sonando) return;
  S.playT = S.playIni + (S.ac.currentTime - S.tIni);
  dibujar();
  requestAnimationFrame(animar);
}
$('bPlay').onclick = reproducir;

$('bGuardar').onclick = async () => {
  if (!S.est || S.ocupado) return;
  if (!(await asegurarRender())) return;
  descargar(Editor.aWav(S.rendered, S.fs), 'estirado.wav', 'audio/wav');
  setEstado('Guardado como estirado.wav');
};

// ---------- Herramientas ----------
const TEXTO_HERR = {
  sel: 'Seleccionar: arrastrá para elegir un tramo; arrastrá los bordes naranjas para ajustarlo.',
  tono: 'Tono: arrastrá sobre las notas para dibujar el tono (solo donde hay voz).',
  cortar: 'Cortar: tocá donde quieras partir el audio (podés arrastrar para ajustar antes de soltar).',
  mover: 'Mover: tocá un segmento para elegirlo y arrastralo a izquierda o derecha. Con Borrar lo sacás.',
};
function herramienta(h) {
  S.herr = h;
  if (h !== 'mover') S.seg = null;
  [['sel', 'tSel'], ['tono', 'tTono'], ['cortar', 'tCortar'], ['mover', 'tMover']]
    .forEach(([k, id]) => $(id).classList.toggle('on', h === k));
  cv.style.cursor = h === 'mover' ? 'grab' : 'crosshair';
  setEstado(TEXTO_HERR[h]);
  dibujar();
}
$('tSel').onclick = () => herramienta('sel');
$('tTono').onclick = () => herramienta('tono');
$('tCortar').onclick = () => herramienta('cortar');
$('tMover').onclick = () => herramienta('mover');

function zoom(f) {
  const { W } = tam();
  const centro = tDeX((W + GUT) / 2);
  S.pps = clamp(S.pps * f, 10, 5000);
  S.t0 = centro - ((W + GUT) / 2 - GUT) / S.pps;
  limitarScroll(); dibujar();
}
$('bMas').onclick = () => zoom(1.5);
$('bMenos').onclick = () => zoom(1 / 1.5);
$('desp').oninput = (e) => { S.t0 = parseFloat(e.target.value); dibujar(); };

// ---------- Mouse / dedo sobre el lienzo ----------
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function ponerTono(p) {
  const G = geom();
  const j = Math.floor(tDeX(p.x) * 1000 / S.fp);
  const midi = clamp(S.mHi - (p.y - G.top) / G.rowH, S.mLo, S.mHi);
  const j0 = S.ultJ === null ? j : S.ultJ, m0 = S.ultM === null ? midi : S.ultM;
  const a = Math.min(j0, j), b = Math.max(j0, j);
  for (let k = a; k <= b; k++) {
    const u = j === j0 ? 1 : (k - j0) / (j - j0);
    Editor.fijarTono(S.est, S.f0, k, k, Editor.midiAHz(m0 + (midi - m0) * u));
  }
  S.ultJ = j; S.ultM = midi;
  recalcular(); dibujar();
}

cv.addEventListener('pointerdown', (e) => {
  if (!S.est || S.ocupado) return;
  cv.setPointerCapture(e.pointerId);
  const p = pos(e);
  if (p.x < GUT) return;
  if (S.herr === 'sel') {
    const t = clamp(tDeX(p.x), 0, duracion()), tol = 10 / S.pps;
    if (S.sel && Math.abs(t - S.sel.a) < tol) S.ancla = S.sel.b;
    else if (S.sel && Math.abs(t - S.sel.b) < tol) S.ancla = S.sel.a;
    else { S.ancla = t; S.sel = { a: t, b: t }; }
    S.arr = 'sel';
  } else if (S.herr === 'tono') {
    guardarHist(); S.arr = 'tono'; S.ultJ = null; S.ultM = null;
    ponerTono(p);
  } else if (S.herr === 'cortar') {
    S.arr = 'cortar'; S.cortePrev = frameDeX(p.x);
  } else if (S.herr === 'mover') {
    S.seg = Editor.segmentoEn(S.est, frameDeX(p.x));
    S.arr = 'mover'; S.moverX0 = p.x; S.moverDelta = 0;
    cv.style.cursor = 'grabbing';
  }
  dibujar();
});
cv.addEventListener('pointermove', (e) => {
  if (!S.arr) return;
  const p = pos(e);
  if (S.arr === 'sel') {
    const t = clamp(tDeX(p.x), 0, duracion());
    S.sel = { a: Math.min(S.ancla, t), b: Math.max(S.ancla, t) };
    dibujar();
  } else if (S.arr === 'tono') {
    ponerTono(p);
  } else if (S.arr === 'cortar') {
    S.cortePrev = frameDeX(p.x);
    dibujar();
  } else if (S.arr === 'mover' && S.seg) {
    S.moverDelta = Math.max(-S.seg.c0, Math.round((p.x - S.moverX0) / S.pps * 1000 / S.fp));
    dibujar();
  }
});

function aplicarCorte() {
  const j = S.cortePrev;
  S.cortePrev = null;
  const e = Editor.dividir(S.est, j);
  if (!e) { setEstado('No se puede cortar ahí: está pegado al borde o a otro corte.'); return; }
  guardarHist();
  S.est = e;
  setEstado('Corte agregado en ' + (j * S.fp / 1000).toFixed(2) + ' s. Con la herramienta Mover podés arrastrar cada segmento.');
}
function aplicarMover() {
  const seg = S.seg, d = S.moverDelta;
  S.moverDelta = 0;
  cv.style.cursor = 'grab';
  if (!seg) return;
  if (!d) { setEstado('Segmento elegido (' + ((seg.c1 - seg.c0) * S.fp / 1000).toFixed(2) + ' s). Arrastralo para moverlo, o apretá Borrar.'); return; }
  const r = Editor.mover(S.est, seg.c0, seg.c1, d);
  if (!r) return;
  guardarHist();
  S.est = r.est; S.seg = { c0: r.c0, c1: r.c1 }; S.sucio = true;
  recalcular(); limitarScroll();
  setEstado('Segmento movido. Donde estaba quedó en silencio.');
}

function soltar() {
  if (!S.arr) return;
  const modo = S.arr;
  S.arr = null;
  if (modo === 'sel') { if (S.sel && S.sel.b - S.sel.a < 0.02) S.sel = null; }
  else if (modo === 'tono') S.sucio = true;
  else if (modo === 'cortar') aplicarCorte();
  else if (modo === 'mover') aplicarMover();
  habilitar(); dibujar();
}
cv.addEventListener('pointerup', soltar);
cv.addEventListener('pointercancel', soltar);

cv.addEventListener('wheel', (e) => {
  if (!S.est) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const p = pos(e), t = tDeX(p.x);
    S.pps = clamp(S.pps * (e.deltaY < 0 ? 1.2 : 1 / 1.2), 10, 5000);
    S.t0 = t - (p.x - GUT) / S.pps;
  } else {
    S.t0 += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / S.pps;
  }
  limitarScroll(); dibujar();
}, { passive: false });

// ---------- Instalar como app (PWA) ----------
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  promptInstalar = e;
  $('bInstalar').hidden = false;
});
$('bInstalar').onclick = async () => {
  if (!promptInstalar) return;
  promptInstalar.prompt();
  try { await promptInstalar.userChoice; } catch (_) { /* cerrado */ }
  promptInstalar = null;
  $('bInstalar').hidden = true;
};
window.addEventListener('appinstalled', () => { $('bInstalar').hidden = true; });
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* sin conexion offline */ }); });
}

window.addEventListener('resize', ajustar);
ajustar();
habilitar();
herramienta('sel');
setEstado('Abrí un audio para empezar.');
})();
</script>
</body>
</html>
